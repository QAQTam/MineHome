[package]
name = "mijia-core"
version = "0.1.0"
edition = "2021"
description = "米家鸿蒙中间件核心层（协议：RC4 签名请求 / auth / device；纯 Rust，可 PC cargo test）"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rand = "0.9"

# cloud / auth（reqwest + rustls，便于后续 ohos 交叉编译）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
async-trait = "0.1"
aes = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
