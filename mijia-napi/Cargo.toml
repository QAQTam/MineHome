[package]
name = "mijia-napi"
version = "0.1.0"
edition = "2021"
description = "mijia-core 的鸿蒙 NAPI 绑定（ohos-rs；ohrs build 产出 libmijia_napi.so）"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
mijia-core = { path = "../mijia-core" }
napi-ohos = { version = "1.0", features = ["async"] }
napi-derive-ohos = "1"
serde_json = "1"

[build-dependencies]
napi-build-ohos = "1"
